# nav2_params_semantic.yaml
local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 15.0
    publish_frequency: 5.0
    width: 6.0
    height: 6.0
    resolution: 0.05
    rolling_window: true
    plugins: ["obstacle_layer","voxel_layer"]

    obstacle_layer:
      enabled: true
      observation_sources: pointcloud semantic_points

      # 原始 LiDAR
      pointcloud:
        topic: /velodyne_points
        sensor_frame: velodyne_link
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.02
        max_obstacle_height: 1.5
        obstacle_range: 3.0
        raytrace_range: 4.0

      # 语义障碍
      semantic_points:
        topic: /semantic_points
        sensor_frame: camera_link
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_range: 4.0
        raytrace_range: 4.0

    voxel_layer:
      enabled: true
      origin_z: -1.0
      z_resolution: 0.1
      z_voxels: 16
